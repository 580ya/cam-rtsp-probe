name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            script: packaging/build_macos.sh
            artifact: macos-x86_64
          - os: windows-2022
            script: packaging/build_windows.ps1
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash ${{ matrix.script }}

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File ${{ matrix.script }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CameraRTSPProbe-${{ matrix.artifact }}
          path: dist/CameraRTSPProbe*
